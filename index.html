            };

                    ...prev,
                    [qId]: { ...prev[qId], [key]: val }
                }));
            };

            const calculateScore = () => {
                let mcqCorrect = 0;
                mcqData.forEach(q => {
                    if (mcqAnswers[q.id] === q.correct) mcqCorrect++;
                });

                let tfTotalItems = 0;
                let tfCorrectItems = 0;
                tfData.forEach(q => {
                    q.items.forEach(item => {
                        tfTotalItems++;
                        if (tfAnswers[q.id] && tfAnswers[q.id][item.key] === item.correct) {
                            tfCorrectItems++;
                        }
                    });
                });

                return {
                    mcqScore: (mcqCorrect * 0.25).toFixed(2),
                    mcqCorrect,
                    mcqTotal: mcqData.length,
                    tfCorrectItems,
                    tfTotalItems,
                    tfScore: ((tfCorrectItems / tfTotalItems) * 3.0).toFixed(2),
                    totalScore: ((mcqCorrect * 0.25) + ((tfCorrectItems / tfTotalItems) * 3.0)).toFixed(2)
                };
            };

                                        <p className="text-xs text-blue-100 uppercase tracking-wider font-medium">Điểm Đúng/Sai (Phần II)</p>
                                        <p className="text-2xl font-black mt-1">{scores.tfScore} / 3.0 điểm</p>
                                        <p className="text-xs text-blue-200 mt-1">Đúng {scores.tfCorrectItems}/{scores.tfTotalItems} ý nhỏ</p>
                                    </div>
                                    <div className="bg-white/20 backdrop-blur-md p-4 rounded-xl border border-white/30">
                                        <p className="text-xs text-blue-100 uppercase tracking-wider font-medium">Tổng Điểm Trắc Nghiệm</p>
                                        <p className="text-3xl font-black text-amber-300 mt-1">{scores.totalScore} / 7.0 điểm</p>
                                        <p className="text-xs text-blue-100 mt-1">Phần Tự luận 3.0đ học theo đáp án bên dưới</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 1: MCQ SECTION */}
                        {tab === "mcq" && (
                            <div className="space-y-6">
                                <div className="border-l-4 border-blue-600 pl-3">
                                    <h2 className="font-bold text-lg text-slate-900">PHẦN I. CÂU HỎI TRẮC NGHIỆM NHIỀU LỰA CHỌN</h2>
                                    <p className="text-xs text-slate-500">Mỗi câu chọn 01 phương án đúng nhất (0.25 điểm/câu)</p>
                                </div>

                                {mcqData.map((q) => {
                                    const userAns = mcqAnswers[q.id];
                                    const isCorrect = userAns === q.correct;

                                    return (
                                        <div key={q.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                            <div className="flex items-center justify-between gap-2">
                                                <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-md">
                                                    {q.lesson} - Câu {q.id}
                                                </span>
                                                {submitted && (
                                                    <span className={`text-xs font-bold px-2.5 py-1 rounded-md ${isCorrect ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>
                                                        {isCorrect ? "Đúng (+0.25đ)" : userAns ? "Sai" : "Chưa chọn"}
                                                    </span>
                                                )}
                                            </div>

                                            <p className="font-semibold text-slate-800 text-base leading-relaxed">{q.question}</p>

                                            <div className="grid grid-cols-1 gap-2 pt-2">
                                                {q.options.map((opt) => {
                                                    const isSelected = userAns === opt.id;
                                                    let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-blue-50/50 hover:border-blue-300";

                                                    if (isSelected) {
                                                        btnStyle = "bg-blue-600 text-white border-blue-600 font-medium shadow-sm";
                                                    }

                                                    if (submitted) {
                                                        if (opt.id === q.correct) {
                                                            btnStyle = "bg-emerald-600 text-white border-emerald-600 font-medium";
                                                        } else if (isSelected && !isCorrect) {
                                                            btnStyle = "bg-rose-600 text-white border-rose-600";
                                                        } else {
                                                            btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                                                        }
                                                    }

                                                    return (
                                                        <button
                                                            key={opt.id}
                                                            onClick={() => handleMcqSelect(q.id, opt.id)}
                                                            className={`w-full text-left px-4 py-3 rounded-xl border transition flex items-start gap-3 ${btnStyle}`}
                                                        >
                                                            <span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold shrink-0 ${isSelected ? "bg-white text-blue-700" : "bg-slate-200 text-slate-700"}`}>
                                                                {opt.id}
                                                            </span>
                                                            <span className="text-sm pt-0.5">{opt.text}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            {submitted && (
                                                <div className="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-600 space-y-1">
                                                    <p className="font-semibold text-slate-800">Giải thích chi tiết:</p>
                                                    <p>{q.rationale}</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* TAB 2: TRUE / FALSE MATRIX */}
                        {tab === "tf" && (
                            <div className="space-y-6">
                                <div className="border-l-4 border-indigo-600 pl-3">
                                    <h2 className="font-bold text-lg text-slate-900">PHẦN II. CÂU HỎI TRẮC NGHIỆM ĐÚNG / SAI</h2>
                                    <p className="text-xs text-slate-500">Mỗi câu gồm 4 nhận định a, b, c, d. Chọn Đúng (Đ) hoặc Sai (S)</p>
                                </div>

                                {tfData.map((q) => (
                                    <div key={q.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-md">
                                                {q.lesson} - {q.title}
                                            </span>
                                        </div>

                                        <p className="text-sm text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200 italic">
                                            {q.context}
                                        </p>

                                        <div className="space-y-3">
                                            {q.items.map((item) => {
                                                const currentVal = tfAnswers[q.id]?.[item.key];
                                                const isItemCorrect = currentVal === item.correct;

                                                return (
                                                    <div key={item.key} className="p-3 border border-slate-200 rounded-xl bg-white space-y-2">
                                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                                            <p className="text-sm text-slate-800 flex-grow">
                                                                <strong className="text-indigo-600 mr-1.5">{item.key})</strong>
                                                                {item.text}
                                                            </p>

                                                            {/* Choice buttons */}
                                                            <div className="flex items-center gap-2 shrink-0">
                                                                <button
                                                                    onClick={() => handleTfSelect(q.id, item.key, true)}
                                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                                                                        currentVal === true
                                                                            ? "bg-emerald-600 text-white border-emerald-600"
                                                                            : "bg-slate-50 text-slate-700 border-slate-200 hover:bg-emerald-50"
                                                                    } ${submitted && item.correct === true ? "ring-2 ring-emerald-500" : ""}`}
                                                                >
                                                                    Đúng (Đ)
                                                                </button>
                                                                <button
                                                                    onClick={() => handleTfSelect(q.id, item.key, false)}
                                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                                                                        currentVal === false
                                                                            ? "bg-rose-600 text-white border-rose-600"
                                                                            : "bg-slate-50 text-slate-700 border-slate-200 hover:bg-rose-50"
                                                                    } ${submitted && item.correct === false ? "ring-2 ring-rose-500" : ""}`}
                                                                >
                                                                    Sai (S)
                                                                </button>
                                                            </div>
                                                        </div>

                                                        {submitted && (
                                                            <div className="text-xs pt-1 border-t border-slate-100 flex items-center justify-between">
                                                                <span className={isItemCorrect ? "text-emerald-600 font-semibold" : "text-rose-600 font-semibold"}>
                                                                    {isItemCorrect ? "✓ Trả lời Đúng" : `✗ Chưa chính xác (Đáp án đúng: ${item.correct ? "Đúng" : "Sai"})`}
                                                                </span>
                                                                <span className="text-slate-500 italic">{item.note}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* TAB 3: ESSAY & THEORY REVIEW */}
                        {tab === "essay" && (
                            <div className="space-y-6">
                                <div className="border-l-4 border-amber-500 pl-3">
                                    <h2 className="font-bold text-lg text-slate-900">PHẦN TỰ LUẬN & ĐÁP ÁN ĐỀ CƯƠNG</h2>
                                    <p className="text-xs text-slate-500">Nội dung lý thuyết chuẩn bị cho bài thi tự luận học kỳ</p>
                                </div>

                                <div className="grid grid-cols-1 gap-4">
                                    {essayData.map((item) => (
                                        <div key={item.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-1 rounded-md">
                                                    {item.section} - {item.id}
                                                </span>
                                            </div>
                                            <h3 className="font-bold text-slate-900 text-base">{item.title}</h3>
                                            <div className="text-sm text-slate-700 whitespace-pre-line leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-200 font-sans">
                                                {item.content}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-4 text-center text-xs">
                        <div className="max-w-5xl mx-auto px-4">
                            <p>© 2026 THCS Nguyễn Hữu Thọ - Đề Cương Ôn Tập Giữa Kì 1 Công Nghệ 9</p>
                            <p className="mt-1 text-slate-500">Giáo viên biên soạn: Đỗ Tấn Thạnh - Đoàn Thị Thủy Tiên</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
